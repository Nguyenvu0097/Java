<!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"><h:head><title>Form sinh viên</title><h:outputStylesheet library="css" name="style.css"/></h:head><h:body><div class="app"><div class="topbar"><div class="brand">LAB 8 • JSF</div><div class="subtitle">Validation &amp; Message</div><div class="nav"><h:link outcome="index" value="Trang chủ"/> <h:link outcome="sinhvien-list" value="Sinh viên"/> <h:link outcome="sach-form" value="Sách"/> <h:link outcome="product-form" value="Sản phẩm"/> <h:link outcome="login" value="Đăng nhập"/></div></div><h2>Bài 4 - Form sinh viên JSF</h2><h:messages globalOnly="true" style="color:green"/><h:form><p>Mã: <h:inputText id="ma" value="#{sinhVienBean.sinhVien.maSinhVien}" required="true" requiredMessage="Mã sinh viên bắt buộc nhập"/><h:message for="ma" style="color:red"/></p><p>Họ tên: <h:inputText id="hoten" value="#{sinhVienBean.sinhVien.hoTen}"/><h:message for="hoten" style="color:red"/></p><p>Email: <h:inputText id="email" value="#{sinhVienBean.sinhVien.email}"/><h:message for="email" style="color:red"/></p><p>Lớp: <h:inputText id="lop" value="#{sinhVienBean.sinhVien.lop}" required="true" requiredMessage="Lớp bắt buộc nhập"/><h:message for="lop" style="color:red"/></p><h:commandButton value="Lưu" action="#{sinhVienBean.save}"/></h:form><h:link outcome="sinhvien-list" value="Danh sách"/><div class="footer">Lab 8 • Jakarta Faces • Java 17</div></div></h:body></html>
