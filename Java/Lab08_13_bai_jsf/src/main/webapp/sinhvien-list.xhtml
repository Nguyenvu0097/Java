<!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"><h:head><title>Danh sách</title><h:outputStylesheet library="css" name="style.css"/></h:head><h:body><div class="app"><div class="topbar"><div class="brand">LAB 8 • JSF</div><div class="subtitle">Validation &amp; Message</div><div class="nav"><h:link outcome="index" value="Trang chủ"/> <h:link outcome="sinhvien-list" value="Sinh viên"/> <h:link outcome="sach-form" value="Sách"/> <h:link outcome="product-form" value="Sản phẩm"/> <h:link outcome="login" value="Đăng nhập"/></div></div><h2>Bài 5,9,10 - Sinh viên</h2><h:form><h:inputText value="#{sinhVienBean.keyword}"/><h:commandButton value="Tìm" action="sinhvien-list?faces-redirect=true"/><h:commandButton value="Thêm" action="sinhvien-form?faces-redirect=true"/><h:messages/><h:dataTable value="#{sinhVienBean.dsSinhVien}" var="sv" border="1"><h:column><f:facet name="header">ID</f:facet>#{sv.id}</h:column><h:column><f:facet name="header">Mã</f:facet>#{sv.maSinhVien}</h:column><h:column><f:facet name="header">Họ tên</f:facet>#{sv.hoTen}</h:column><h:column><f:facet name="header">Email</f:facet>#{sv.email}</h:column><h:column><f:facet name="header">Lớp</f:facet>#{sv.lop}</h:column><h:column><h:commandButton value="Sửa" action="#{sinhVienBean.prepareEdit(sv.id)}"/><h:commandButton value="Xóa" action="#{sinhVienBean.delete(sv.id)}"/></h:column></h:dataTable></h:form><h:panelGroup rendered="#{sinhVienBean.sinhVien.id gt 0}"><h3>Sửa</h3><h:form><h:inputText value="#{sinhVienBean.sinhVien.hoTen}"/><h:inputText value="#{sinhVienBean.sinhVien.email}"/><h:inputText value="#{sinhVienBean.sinhVien.lop}"/><h:commandButton value="Cập nhật" action="#{sinhVienBean.update}"/></h:form></h:panelGroup><div class="footer">Lab 8 • Jakarta Faces • Java 17</div></div></h:body></html>
